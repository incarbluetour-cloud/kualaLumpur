<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쿠알라룸푸르 실시간 시계·날씨·환율</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,'Malgun Gothic',sans-serif;
  background:transparent;
  color:#20242E;
  overflow-x:hidden; /* 가로 스크롤바 방지 */
}
:root{
  --kl-navy:#27398C;
  --kl-lagoon:#10A8B8;
  --kl-lagoon-soft:#E4F6F8;
  --kl-gray:#6B7280;
  --kl-line:#E5E7EB;
  --mobi-navy:#27398C;
}
a{text-decoration:none;color:inherit;}

/* 레이아웃 영역 여백 최적화 */
.kl-wrap{
  width:100%;
  max-width:900px;
  margin:0 auto;
  padding:6px;
  box-sizing:border-box;
}

.kl-clocks{
  display:flex;align-items:stretch;gap:0;
  background:#fff;border:1px solid var(--kl-line);border-radius:18px;
  box-shadow:0 10px 28px rgba(27,42,107,.12);
  overflow:hidden;
}

.kl-clock{flex:1;text-align:center;padding:16px 6px 14px;}
.kl-clock-city{display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--kl-gray);margin-bottom:4px;line-height:1.2;}
.kl-clock-time{display:block;font-size:clamp(20px,4.5vw,30px);font-weight:800;color:var(--kl-navy);font-variant-numeric:tabular-nums;line-height:1.15;}
.kl-clock-sub{display:block;font-size:11.5px;color:var(--kl-gray);margin-top:4px;line-height:1.25;}

.kl-clock-mid{
  flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:0 8px;background:var(--kl-lagoon-soft);
  font-size:11px;font-weight:700;color:#0B7681;line-height:1.35;text-align:center;
}
.kl-clock-mid b{font-size:13.5px;}

.kl-live{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
.kl-live-card{
  display:flex;align-items:center;gap:10px;
  background:#fff;border:1px solid var(--kl-line);border-radius:16px;
  padding:12px 14px;
  box-shadow:0 4px 14px rgba(27,42,107,.10);
}
.kl-live-card:hover{border-color:var(--kl-lagoon);}
.kl-live-ico{font-size:26px;line-height:1;flex:0 0 auto;}
.kl-live-main{display:block;font-size:15px;font-weight:800;color:var(--kl-navy);line-height:1.3;font-variant-numeric:tabular-nums;}
.kl-live-sub{display:block;font-size:11.5px;color:var(--kl-gray);margin-top:2px;}

/* mobi 제휴 배너 */
.mobi-banner-card{
  display:flex;align-items:center;justify-content:space-between;
  background:#fff;border:1px solid var(--kl-line);border-radius:16px;
  padding:12px 14px;margin-top:8px;
  box-shadow:0 4px 14px rgba(27,42,107,.10);
  transition:all 0.2s ease;
  gap:8px;
}
.mobi-banner-card:hover{border-color:var(--mobi-navy); background:#F9FAFB;}

.mobi-banner-left{
  display:flex;align-items:center;gap:10px;
  min-width:0;
  flex:1 1 auto;
}

.mobi-svg-logo{
  height:18px;
  width:auto;
  flex:0 0 auto;
  color:#20242E;
}

.mobi-badge{
  background:var(--mobi-navy);
  color:#fff;
  font-size:11px;font-weight:800;padding:4px 8px;border-radius:20px;
  flex:0 0 auto;
  white-space:nowrap;
}

/* 하단 2열 버튼 영역 */
.kl-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
.kl-btn-card{
  display:flex;align-items:center;gap:10px;
  background:#fff;border:1px solid var(--kl-line);border-radius:16px;
  padding:12px 14px;
  box-shadow:0 4px 14px rgba(27,42,107,.10);
  transition:all 0.2s ease;
  min-width:0;
}
.kl-btn-card:hover{border-color:var(--kl-lagoon);}

@media (max-width:480px){
  .kl-clock{padding:14px 4px 12px;}
  .kl-live{grid-template-columns:1fr;}
  .kl-btns{grid-template-columns:1fr;}
  .kl-live-ico{font-size:22px;}
  .kl-live-main{font-size:13.5px;}
  .kl-live-sub{font-size:10.5px;}
  
  .mobi-banner-card{padding:10px 10px; gap:6px;}
  .mobi-banner-left{gap:8px;}
  .mobi-svg-logo{height:15px;}
  .mobi-badge{font-size:10px; padding:3px 6px;}
  
  .kl-live-card, .kl-btn-card{padding:10px 10px;gap:8px;}
}
</style>
</head>
<body>

      <span class="kl-clock-city">SEOUL · 서울</span>
      <span class="kl-clock-time" id="kl-time-kr">00:00:00</span>
      <span class="kl-clock-sub" id="kl-date-kr">대한민국 표준시</span>
    </div>
    <div class="kl-clock-mid"><b>-1h</b>쿠알라룸푸르가<br>1시간 느림</div>
    <div class="kl-clock">
      <span class="kl-clock-city">KUALA LUMPUR<br>쿠알라룸푸르</span>

<script>
(function(){
  var tk=document.getElementById('kl-time-kr'), tg=document.getElementById('kl-time-kl'),
      dk=document.getElementById('kl-date-kr'), dg=document.getElementById('kl-date-kl');

  function fmt(tz){
    var n=new Date();
    return{
      t:n.toLocaleTimeString('ko-KR',{timeZone:tz,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}),
      d:n.toLocaleDateString('ko-KR',{timeZone:tz,month:'long',day:'numeric',weekday:'short'})
    };
  }

  function tick(){
    var kr=fmt('Asia/Seoul'), lc=fmt('Asia/Kuala_Lumpur');
    if(tk){tk.textContent=kr.t;}
    if(tg){tg.textContent=lc.t;}
    if(dk){dk.innerHTML=kr.d+'<br>대한민국';}
    if(dg){dg.innerHTML=lc.d+'<br>쿠알라룸푸르 현지';}
  }
  if(tk||tg){tick(); setInterval(tick,1000);}

  function wxIcon(c){
    if(c===0)return['☀️','맑음'];
    if(c<=2)return['🌤️','대체로 맑음'];
    if(c===3)return['☁️','흐림'];
    if(c<=48)return['🌫️','안개'];
    if(c<=57)return['🌦️','이슬비'];
    if(c<=67)return['🌧️','비'];
    if(c<=77)return['🌨️','눈'];
    if(c<=82)return['🌧️','소나기'];
    if(c<=86)return['🌨️','눈'];
    return['⛈️','뇌우'];
  }
  var wI=document.getElementById('kl-wx-ico'), wM=document.getElementById('kl-wx-main'), wS=document.getElementById('kl-wx-sub');
  if(wM){
    fetch('https://api.open-meteo.com/v1/forecast?latitude=3.1390&longitude=101.6869&current_weather=true')
      .then(function(r){return r.json();})
      .then(function(j){
        var cw=j.current_weather; if(!cw)return;
        var ic=wxIcon(cw.weathercode);
        wI.textContent=ic[0];
        wM.textContent='쿠알라룸푸르 '+Math.round(cw.temperature)+'℃ · '+ic[1];
        wS.textContent='시내 현재 날씨 · 탭하여 상세 보기 ›';
      }).catch(function(){});
  }

  var fM=document.getElementById('kl-fx-main'), fS=document.getElementById('kl-fx-sub');
  function setFx(v){
    fM.textContent='1 MYR ≈ '+Math.round(v).toLocaleString('ko-KR')+'원';
    fS.textContent='참고 시세 · 탭하면 하나은행 고시환율 ›';
  }
  if(fM){
    fetch('https://api.frankfurter.app/latest?from=MYR&to=KRW')
      .then(function(r){return r.json();})
      .then(function(j){ if(j&&j.rates&&j.rates.KRW) setFx(j.rates.KRW); else throw 0; })
      .catch(function(){
        fetch('https://open.er-api.com/v6/latest/MYR')
          .then(function(r){return r.json();})
          .then(function(j){ if(j&&j.rates&&j.rates.KRW) setFx(j.rates.KRW); })
          .catch(function(){});
      });
  }
})();
</script>
