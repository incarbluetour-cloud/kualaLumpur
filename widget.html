<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쿠알라룸푸르 실시간 시계·날씨·환율</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,'Malgun Gothic',sans-serif;
  background:transparent;
  color:#20242E;
}
:root{
  --kl-navy:#27398C;
  --kl-lagoon:#10A8B8;
  --kl-lagoon-soft:#E4F6F8;
  --kl-gray:#6B7280;
  --kl-line:#E5E7EB;
}
a{text-decoration:none;color:inherit;}
.kl-wrap{max-width:900px;margin:0 auto;padding:10px;}
.kl-clocks{
  display:flex;align-items:stretch;gap:0;
  background:#fff;border:1px solid var(--kl-line);border-radius:18px;
  box-shadow:0 10px 28px rgba(27,42,107,.12);
  overflow:hidden;
}
.kl-clock{flex:1;text-align:center;padding:20px 10px 18px;}
.kl-clock-city{display:block;font-size:12.5px;font-weight:700;letter-spacing:.12em;color:var(--kl-gray);margin-bottom:4px;}
.kl-clock-time{display:block;font-size:clamp(24px,5vw,32px);font-weight:800;color:var(--kl-navy);font-variant-numeric:tabular-nums;line-height:1.15;}
.kl-clock-sub{display:block;font-size:12px;color:var(--kl-gray);margin-top:3px;}
.kl-clock-mid{
  flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:0 14px;background:var(--kl-lagoon-soft);
  font-size:12px;font-weight:700;color:#0B7681;line-height:1.5;text-align:center;
}
.kl-clock-mid b{font-size:15px;}
.kl-live{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.kl-live-card{
  display:flex;align-items:center;gap:12px;
  background:#fff;border:1px solid var(--kl-line);border-radius:16px;
  padding:14px 16px;
  box-shadow:0 4px 14px rgba(27,42,107,.10);
}
.kl-live-card:hover{border-color:var(--kl-lagoon);}
.kl-live-ico{font-size:30px;line-height:1;flex:0 0 auto;}
.kl-live-main{display:block;font-size:16.5px;font-weight:800;color:var(--kl-navy);line-height:1.3;font-variant-numeric:tabular-nums;}
.kl-live-sub{display:block;font-size:12px;color:var(--kl-gray);margin-top:2px;}
@media (max-width:480px){
  .kl-live{grid-template-columns:1fr;}
  .kl-live-ico{font-size:25px;}
  .kl-live-main{font-size:14.5px;}
  .kl-live-card{padding:12px 13px;gap:9px;}
}
</style>
</head>
<body>
<div class="kl-wrap">
  <div class="kl-clocks">
    <div class="kl-clock">
      <span class="kl-clock-city">SEOUL · 서울</span>
      <span class="kl-clock-time" id="kl-time-kr">GMT+9</span>
      <span class="kl-clock-sub" id="kl-date-kr">대한민국 표준시</span>
    </div>
    <div class="kl-clock-mid"><b>-1h</b>쿠알라룸푸르가<br>1시간 느림</div>
    <div class="kl-clock">
      <span class="kl-clock-city">KUALA LUMPUR <br>쿠알라룸푸르</span>
      <span class="kl-clock-time" id="kl-time-kl">GMT+8</span>
      <span class="kl-clock-sub" id="kl-date-kl">말레이시아 표준시</span>
    </div>
  </div>
  <div class="kl-live">
    <a class="kl-live-card" href="https://www.google.com/search?q=%EC%BF%A0%EC%95%8C%EB%9D%BC%EB%A3%B8%ED%91%B8%EB%A5%B4+%EB%82%A0%EC%94%A8" target="_blank" rel="noopener">
      <span class="kl-live-ico" id="kl-wx-ico">🌤️</span>
      <span><span class="kl-live-main" id="kl-wx-main">쿠알라룸푸르 현재 날씨</span>
      <span class="kl-live-sub" id="kl-wx-sub">시내 기준 · 탭하여 확인 ›</span></span>
    </a>
    <a class="kl-live-card" href="https://www.kebhana.com/exchange_rate/excRate.do?subMenu=1" target="_blank" rel="noopener">
      <span class="kl-live-ico" style="font-size:20px;font-weight:800;color:var(--kl-navy);white-space:nowrap;">RM<span style="color:var(--kl-lagoon);">⇄</span>₩</span>
      <span><span class="kl-live-main" id="kl-fx-main">MYR 환율</span>
      <span class="kl-live-sub" id="kl-fx-sub">하나은행 실시간 환율 보기 ›</span></span>
    </a>
  </div>
</div>
<script>
(function(){
  var tk=document.getElementById('kl-time-kr'), tg=document.getElementById('kl-time-kl'),
      dk=document.getElementById('kl-date-kr'), dg=document.getElementById('kl-date-kl');
  function fmt(tz){var n=new Date();return{t:n.toLocaleTimeString('ko-KR',{timeZone:tz,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}),d:n.toLocaleDateString('ko-KR',{timeZone:tz,month:'long',day:'numeric',weekday:'short'})};}
  function tick(){
    var kr=fmt('Asia/Seoul'), lc=fmt('Asia/Kuala_Lumpur');
    if(tk){tk.textContent=kr.t; dk.textContent=kr.d+' · 대한민국';}
    if(tg){tg.textContent=lc.t; dg.textContent=lc.d+' · 쿠알라룸푸르 현지';}
  }
  if(tk||tg){tick(); setInterval(tick,1000);}

  function wxIcon(c){
    if(c===0)return['☀️','맑음'];
    if(c<=2)return['🌤️','대체로 맑음'];
    if(c===3)return['☁️','흐림'];
    if(c<=48)return['🌫️','안개'];
    if(c<=57)return['🌦️','이슬비'];
    if(c<=67)return['🌧️','비'];
    if(c<=77)return['🌨️','눈'];
    if(c<=82)return['🌧️','소나기'];
    if(c<=86)return['🌨️','눈'];
    return['⛈️','뇌우'];
  }
  var wI=document.getElementById('kl-wx-ico'), wM=document.getElementById('kl-wx-main'), wS=document.getElementById('kl-wx-sub');
  if(wM){
    fetch('https://api.open-meteo.com/v1/forecast?latitude=3.1390&longitude=101.6869&current_weather=true')
      .then(function(r){return r.json();})
      .then(function(j){
        var cw=j.current_weather; if(!cw)return;
        var ic=wxIcon(cw.weathercode);
        wI.textContent=ic[0];
        wM.textContent='KL '+Math.round(cw.temperature)+'℃ · '+ic[1];
        wS.textContent='시내 현재 날씨 · 탭하여 상세 보기 ›';
      }).catch(function(){});
  }

  var fM=document.getElementById('kl-fx-main'), fS=document.getElementById('kl-fx-sub');
  function setFx(v){
    fM.textContent='1 MYR ≈ '+Math.round(v).toLocaleString('ko-KR')+'원';
    fS.textContent='참고 시세 · 탭하면 하나은행 고시환율 ›';
  }
  if(fM){
    fetch('https://api.frankfurter.app/latest?from=MYR&to=KRW')
      .then(function(r){return r.json();})
      .then(function(j){ if(j&&j.rates&&j.rates.KRW) setFx(j.rates.KRW); else throw 0; })
      .catch(function(){
        fetch('https://open.er-api.com/v6/latest/MYR')
          .then(function(r){return r.json();})
          .then(function(j){ if(j&&j.rates&&j.rates.KRW) setFx(j.rates.KRW); })
          .catch(function(){});
      });
  }
})();
</script>
</body>
</html>
